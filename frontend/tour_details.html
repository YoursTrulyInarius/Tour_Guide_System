<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tour Details - TourGuide PH</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <style>
        /* ---- Premium Tour Details Styles ---- */
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #f8fafc;
            color: #1e293b;
            line-height: 1.6;
        }

        /* ---- Navbar (Premium) ---- */
        #navbar {
            background: rgba(26, 26, 46, 0.95);
            backdrop-filter: blur(10px);
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: fixed;
            top: 0; width: 100%;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .logo {
            font-size: 1.5rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -1px;
        }

        .logo span { color: #00b4db; }

        .nav-links {
            display: flex;
            list-style: none;
            gap: 24px;
            align-items: center;
        }

        .nav-links a {
            text-decoration: none;
            color: #e2e8f0;
            font-weight: 500;
            font-size: 0.9rem;
            transition: color 0.3s;
        }

        .nav-links a:hover { color: #00b4db; }

        /* ---- Hero Section ---- */
        .hero {
            position: relative;
            height: 60vh;
            width: 100%;
            overflow: hidden;
            display: flex;
            align-items: flex-end;
            padding: 0 5% 60px;
            background: #1a1a2e;
        }

        .hero-img {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }

        .hero-overlay {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: linear-gradient(0deg, rgba(26,26,46,1) 0%, rgba(26,26,46,0.4) 50%, rgba(26,26,46,0) 100%);
        }

        .hero-title-area {
            position: relative;
            z-index: 10;
            max-width: 800px;
        }

        .hero h1 {
            font-size: 3.5rem;
            font-weight: 800;
            color: #fff;
            line-height: 1.1;
            margin-bottom: 12px;
            text-shadow: 0 4px 12px rgba(0,0,0,0.3);
        }

        .badge-location {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 30px;
            color: #fff;
            font-size: 0.85rem;
            font-weight: 500;
            margin-bottom: 20px;
        }

        /* ---- Main Content Layout ---- */
        .main-container {
            max-width: 1200px;
            margin: -40px auto 100px;
            padding: 0 24px;
            display: grid;
            grid-template-columns: 1.8fr 1fr;
            gap: 40px;
            position: relative;
            z-index: 20;
        }

        /* ---- Tour Details Card ---- */
        .details-card {
            background: #fff;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.05);
            border: 1px solid #edf2f7;
        }

        .info-strip {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 40px;
            padding-bottom: 30px;
            border-bottom: 1px solid #f1f5f9;
        }

        .info-item {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .info-item label {
            font-size: 0.75rem;
            color: #64748b;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-item span {
            font-size: 1.1rem;
            font-weight: 700;
            color: #1e293b;
        }

        .description h3 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 16px;
            color: #0f172a;
        }

        .description p {
            font-size: 1.05rem;
            color: #475569;
            white-space: pre-line;
        }

        /* ---- Booking Sidebar ---- */
        .booking-sidebar {
            position: sticky;
            top: 100px;
            align-self: flex-start;
        }

        .booking-widget {
            background: #fff;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.08);
            border: 1px solid #edf2f7;
        }

        .price-tag {
            font-size: 2rem;
            font-weight: 800;
            color: #1e293b;
            margin-bottom: 24px;
            display: flex;
            align-items: baseline;
            gap: 4px;
        }

        .price-tag .unit {
            font-size: 0.9rem;
            color: #64748b;
            font-weight: 500;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #475569;
            margin-bottom: 8px;
        }

        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            font-family: inherit;
            font-size: 1rem;
            transition: border-color 0.3s, box-shadow 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #00b4db;
            box-shadow: 0 0 0 4px rgba(0,180,219,0.1);
        }

        .btn-book {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #00b4db, #0083b0);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            align-items: center; justify-content: center; gap: 10px;
        }

        .btn-book:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(0,180,219,0.3);
        }

        .login-prompt {
            text-align: center;
            padding: 20px;
            background: #f1f5f9;
            border-radius: 12px;
            font-size: 0.9rem;
            color: #475569;
        }

        .login-prompt a {
            color: #0083b0;
            font-weight: 700;
            text-decoration: none;
        }

        /* ---- Toast ---- */
        .toast {
            position: fixed;
            bottom: 24px; right: 24px;
            padding: 14px 20px;
            border-radius: 10px;
            font-size: 0.875rem;
            font-weight: 500;
            color: #fff;
            z-index: 9999;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s ease;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
        }

        .toast.show { transform: translateY(0); opacity: 1; }
        .toast.success { background: linear-gradient(135deg, #38a169, #48bb78); }
        .toast.error   { background: linear-gradient(135deg, #e53e3e, #fc8181); }

        @media (max-width: 900px) {
            .main-container { grid-template-columns: 1fr; }
            .hero h1 { font-size: 2.5rem; }
            .booking-sidebar { position: static; }
        }
    </style>
</head>

<body>
    <nav id="navbar">
        <div class="logo">Tour<span>Guide</span></div>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li id="nav-login"><a href="login.html">Login</a></li>
            <li id="nav-register"><a href="register.html">Register</a></li>
            <li id="nav-dashboard" style="display: none;"><a href="#" id="dashboard-link">Dashboard</a></li>
            <li id="nav-logout" style="display: none;"><a href="#" id="logout-btn">Logout</a></li>
        </ul>
    </nav>

    <div id="tour-details-page">
        <!-- Full Immersive Hero -->
        <div class="hero" id="hero-area">
            <img id="hero-img" src="https://via.placeholder.com/1920x800" class="hero-img">
            <div class="hero-overlay"></div>
            <div class="hero-title-area">
                <div class="badge-location" id="badge-location">📍 Loading location...</div>
                <h1 id="tour-title">Loading Tour...</h1>
                <p style="color:rgba(255,255,255,0.8); font-size: 1.1rem; font-weight: 400;">Hosted by <span id="guide-name" style="color:#fff; font-weight:600;">...</span></p>
            </div>
        </div>

        <main class="main-container">
            <!-- Details Area -->
            <div class="details-card">
                <div class="info-strip">
                    <div class="info-item">
                        <label>Duration</label>
                        <span id="tour-duration">... hours</span>
                    </div>
                    <div class="info-item">
                        <label>Language</label>
                        <span>English, Tagalog</span>
                    </div>
                    <div class="info-item">
                        <label>Availability</label>
                        <span>Daily</span>
                    </div>
                </div>

                <div class="description">
                    <h3>About this tour</h3>
                    <p id="tour-description">Loading amazing details for you...</p>
                </div>
            </div>

            <!-- Booking Section -->
            <div class="booking-sidebar">
                <div class="booking-widget">
                    <div class="price-tag">
                        <span id="tour-price">0.00</span>
                        <span class="unit">/ person</span>
                    </div>

                    <div id="booking-form-area" style="display: none;">
                        <form id="booking-form">
                            <input type="hidden" id="tour-id-input">
                            <div class="form-group">
                                <label for="booking-date">Select Date</label>
                                <input type="date" id="booking-date" required min="">
                            </div>
                            <button type="submit" class="btn-book">
                                📅 Book Now
                            </button>
                        </form>
                    </div>

                    <div id="login-to-book" class="login-prompt" style="display: none;">
                        <p>Join TourGuide PH to book this tour.</p>
                        <div style="margin-top: 10px;">
                            <a href="login.html">Login</a> or <a href="register.html">Register</a>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="js/app.js"></script>
    <script>
        // Set min date for booking as today
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('booking-date').setAttribute('min', today);

        function showToast(message, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = message;
            t.className = `toast ${type} show`;
            setTimeout(() => t.classList.remove('show'), 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const tourId = urlParams.get('id');
            if (tourId) {
                loadTourDetails(tourId);
            }
        });

        async function loadTourDetails(id) {
            const user = JSON.parse(localStorage.getItem('user'));
            try {
                const response = await apiFetch(`${API_BASE}/tours.php?id=${id}`);
                const data = await response.json();

                if (data && data.length > 0) {
                    const tour = data[0];
                    const img = tour.image ? tour.image : 'https://images.unsplash.com/photo-1518509562904-e7ef99cdcc86?w=1200&q=80';

                    // Update UI
                    document.getElementById('hero-img').src = img;
                    document.getElementById('tour-title').textContent = tour.title;
                    document.getElementById('badge-location').textContent = `📍 ${tour.location}`;
                    document.getElementById('tour-duration').textContent = `${tour.duration} hours`;
                    document.getElementById('tour-price').textContent = `₱${parseFloat(tour.price).toLocaleString()}`;
                    document.getElementById('guide-name').textContent = tour.guide_name;
                    document.getElementById('tour-description').textContent = tour.description;
                    document.getElementById('tour-id-input').value = tour.id;

                    // Show appropriate booking section
                    if (user && user.role === 'tourist') {
                        document.getElementById('booking-form-area').style.display = 'block';
                    } else if (user && user.role !== 'tourist') {
                        document.getElementById('booking-form-area').innerHTML = '<p class="login-prompt">Only tourist accounts can book tours.</p>';
                        document.getElementById('booking-form-area').style.display = 'block';
                    } else {
                        document.getElementById('login-to-book').style.display = 'block';
                    }
                }
            } catch (error) {
                console.error('Error loading tour details', error);
                showToast('Failed to load tour details.', 'error');
            }
        }

        document.getElementById('booking-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const tour_id = document.getElementById('tour-id-input').value;
            const booking_date = document.getElementById('booking-date').value;

            try {
                const response = await apiFetch(`${API_BASE}/bookings.php`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ tour_id, booking_date })
                });
                const data = await response.json();
                if (response.ok) {
                    showToast('Booking successful! Redirecting...');
                    setTimeout(() => {
                        window.location.href = 'dashboard_tourist.html';
                    }, 2000);
                } else {
                    showToast(data.message || 'Booking failed.', 'error');
                }
            } catch (error) {
                console.error('Booking error', error);
                showToast('An error occurred during booking.', 'error');
            }
        });
    </script>
</body>

</html>
